services:
#Manages Kafka cluster metadata
  #Keeps track of brokers
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1  # Unique ID of Kafka server
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181  # Kafka connects to Zookeeper

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092 #Kafka listens inside container
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092 #This tells Spring Boot where Kafka is reachable

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # Only 1 broker → no replication needed

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"